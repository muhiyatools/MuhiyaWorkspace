version: '3.8'

services:
  muhiyallm:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      # External PostgreSQL connection string
      # Set this in your CI/CD pipeline or elest.io environment variables
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-adminpassword}
