services:
  muhiyallm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muhiyallm
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.muhiyallm.rule=Host(`${GATEWAY_DOMAIN:-gateway.dawa24.com}`)"
      - "traefik.http.routers.muhiyallm.entrypoints=web,websecure"
      - "traefik.http.routers.muhiyallm.tls.certresolver=letsencrypt"
      - "traefik.http.services.muhiyallm.loadbalancer.server.port=8090"
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DEV_MODE=${DEV_MODE:-}
      - REQUIRE_REDIS=${REQUIRE_REDIS:-true}
      - PROVIDER_KEY_ENCRYPTION_KEY=${PROVIDER_KEY_ENCRYPTION_KEY:-}
      - IDENTITY_SECRET=${IDENTITY_SECRET:-}
      - REQUEST_LOG_RETENTION_DAYS=${REQUEST_LOG_RETENTION_DAYS:-}
      - MAX_INFLIGHT_REQUEST_BYTES=${MAX_INFLIGHT_REQUEST_BYTES:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - REDIS_URL=${REDIS_URL}
    networks:
      - postgresql-psr0_default

networks:
  postgresql-psr0_default:
    external: true

