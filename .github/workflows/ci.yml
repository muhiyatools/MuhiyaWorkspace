name: Gateway CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://gateway:gateway@127.0.0.1:5432/gateway_test?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379/0
      REQUIRE_REDIS: "1"
      GO_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Unit and live dependency tests
        run: go test ./... -count=1
      - name: Race tests
        run: go test -race ./... -count=1
      - run: go build -trimpath ./...

