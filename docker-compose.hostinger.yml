version: "3.8"

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muhiyallm_gateway
    restart: always
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - GATEWAY_DOMAIN=${GATEWAY_DOMAIN:-api.dawa24.com}
      - ADMIN_ALLOWED_ORIGINS=${ADMIN_ALLOWED_ORIGINS:-api.dawa24.com}
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DEV_MODE=${DEV_MODE:-false}
      - REQUIRE_REDIS=${REQUIRE_REDIS:-true}
      - REDIS_URL=${REDIS_URL:-redis://:RlTCSKH27v5fBT3uCPUcE3Zf3412tB4P@redis:6379/0}
      - PROVIDER_KEY_ENCRYPTION_KEY=${PROVIDER_KEY_ENCRYPTION_KEY:-}
      - IDENTITY_SECRET=${IDENTITY_SECRET:-}
      - REQUEST_LOG_RETENTION_DAYS=${REQUEST_LOG_RETENTION_DAYS:-30}
      - MAX_INFLIGHT_REQUEST_BYTES=${MAX_INFLIGHT_REQUEST_BYTES:-268435456}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
    depends_on:
      - redis
    networks:
      - gateway_net

  redis:
    image: redis:7-alpine
    container_name: muhiyallm_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-RlTCSKH27v5fBT3uCPUcE3Zf3412tB4P}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gateway_net

volumes:
  redis_data:

networks:
  gateway_net:
    driver: bridge
